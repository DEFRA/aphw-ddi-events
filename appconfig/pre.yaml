---
environment: production
environmentCode: pre
container:
  messageQueueHost: PREFFCINFSB1001.servicebus.windows.net
  eventsTopicAddress: aphw-ddi-events
  alertTopicAddress: aphw-ddi-index-alert
secretProviderClass:
  azure:
    keyvaultName: PREFFCINFKV1001
    objects:
      - objectName: pre-ffcahwr-appinsights-connectionString
        objectType: secret
      - objectName: PRE-aphw-ddi-portal-jwt-public-key
        objectType: secret
      - objectName: PRE-aphw-ddi-enforcement-jwt-public-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-events
      type: Opaque
      data:
        - objectName: pre-ffcahwr-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: PRE-aphw-ddi-portal-jwt-public-key
          key: PORTAL_PUBLIC_KEY
        - objectName: PRE-aphw-ddi-enforcement-jwt-public-key
          key: ENFORCEMENT_PUBLIC_KEY
