environment: production
environmentCode:
name: aphw-ddi-events
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-events

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: aphw-ddi-events

containerSecret:
  name: aphw-ddi-events

deployment:
  replicas: 1
  minReplicas: 1
  maxReplicas: 4
  cpuThreshold: 80
  memoryThreshold: 150Mi

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 200Mi
  limitCpu: 200m
  port: 3000
  messageQueueHost: namespace.servicebus.windows.net
  eventsTopicAddress: aphw-ddi-events
  eventsSubscriptionAddress: aphw-ddi-event-hub
  alertTopicAddress: aphw-ddi-index-alert
  azureStorageConnectionString: dummy
  azureStorageUseConnectionString: false
  azureStorageAccountName: dangerousdogindex
  permittedDomains: dummy

livenessProbe:
  path: /healthz
  port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  path: /healthy
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

ingress:
  class: nginx
  endpoint: aphw-ddi-events
  server: example.com

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
      - objectName: snd2-aphw-ddi-portal-jwt-public-key
        objectType: secret
      - objectName: snd2-aphw-ddi-enforcement-jwt-public-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-events
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: snd2-aphw-ddi-portal-jwt-public-key
          key: PORTAL_PUBLIC_KEY
        - objectName: snd2-aphw-ddi-enforcement-jwt-public-key
          key: ENFORCEMENT_PUBLIC_KEY
